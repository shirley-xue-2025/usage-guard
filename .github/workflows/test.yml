name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Public-repo clean check
        run: bash scripts/check-public-clean.sh
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        run: python3 -m pytest tests/ -q
